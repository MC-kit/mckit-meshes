[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12,<0.13" ]

[project]
name = "mckit-meshes"
version = "0.5.1.dev1"
description = "Python tools to work with MCNP meshtallies and weight meshes."
readme = "README.rst"
keywords = [ "MCNP", "mesh", "variance reduction", "weights" ]
license = { text = "MIT" }
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "cyclopts>=3.24",
  "eliot>=1.17.5",
  "matplotlib>=3.10.7", # TODO @dvp: move to optional deps (doctest needs this here)
  "numpy>=2.4",
  "pyevtk>=1.4",
  "rich>=15",
  "toolz>=0.11",
]
[[project.authors]]
name = "dvp2015"
email = "dmitri_portnov@yahoo.com"
[project.optional-dependencies]
plot = [
  "jupyterlab>=4.4.10",
  "jupytext>=1.18.1",
  "matplotlib>=3.10.7",
  "seaborn>=0.13.2",
]
[project.scripts]
mckit-meshes = "mckit_meshes.__main__:main"
[project.urls]
Changelog = "https://github.com/MC-kit/mckit-meshes/releases"
documentation = "https://mckit-meshes.readthedocs.io"
homepage = "https://github.com/MC-kit/mckit-meshes"
repository = "https://github.com/MC-kit/mckit-meshes"

[dependency-groups]
dev = [
  "eliot-tree>=24",
  { include-group = "style" },
  { include-group = "test" },
]
test = [
  "pytest>=9",
  "pytest-cov>=7.1",
  "pytest-mock>=3.15",
  "pytest-xdist[psutil]>=3.8",
  "xdoctest>=1.3",
]
docs = [
  "esbonio>=2",
  "rstcheck[sphinx,toml]>=6.2.5",
  "sphinx>=9.1",
  "sphinx-autobuild>=2025.8.25",
  "sphinx-autodoc-typehints>=3.10",
  "sphinx-togglebutton>=0.4",
]
analyze = [ "jupyterlab>=4.5", "jupytext>=1.19" ]
lint = [ "pylint", "pylint-per-file-ignores" ]
mypy = [ "mypy>=1.2", "pep8-naming>=0.12.1", "types-setuptools>=80.9.0.20250529" ]
pre_commit = [
  "pre-commit>=4.3",
  { include-group = "ruff" },
]
pyright = [ "pyright>=1.1.406" ]
ruff = [ "ruff>=0.0.259" ]
style = [
  "basedpyright>=1.39.9",
  "pyrefly>=1.1.1",
  "ty>=0.0.70",
  { include-group = "lint" },
  { include-group = "mypy" },
  { include-group = "pre_commit" },
  { include-group = "pyright" },
  { include-group = "ruff" },
]
typeguard = [ "typeguard>=4.5" ]

[tool.mypy]
files = "src/**/*.py"
follow_imports = "silent"
python_version = "3.14"
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
# strict = true  # TODO dvp: uncomment this to get strict control
show_error_context = true
pretty = true
cache_dir = ".cache/mypy"
warn_unused_configs = true
show_error_codes = true
[[tool.mypy.overrides]]
module = [
  "click",
  "click.testing",
  "cyclopts",
  "dask.*",
  "duckdb",
  "eliot",
  "eliot.*",
  "IPython.core.magic",
  "IPython.core.magic_arguments",
  "loguru",
  "mckit_nuclides.*",
  "msgspec",
  "multipledispatch",
  "numpy",
  "numpy.testing",
  "pandas",
  "polars",
  "pyevtk.*",
  "pytest",
  "rich",
  "rich.*",
  "scipy.constants",
  "scipy.sparse",
  "tomli",
  "tomllib",
  "toolz.*",
  "xdoctest",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [ "tomllib" ]
allow_redefinition = true
disable_error_code = "no-redef"

[tool.coverage]
[tool.coverage.paths]
source = [ "src" ]
[tool.coverage.report]
exclude_lines = [
  "def __repr__",
  "if __name__ == .__main__.:",
  "if 0:",
  "if TYPE_CHECKING:",
  "if self.debug",
  "pragma: no cover",
  "raise AssertionError",
  "raise NotImplementedError",
]
fail_under = 80  # TODO dvp: increase limit to 100 with code maturing
ignore_errors = true
omit = [ "**/__init__.py", "**/types.py", "*_tab.py" ]
show_missing = true
skip_covered = true
sort = "Cover"
[tool.coverage.run]
branch = true
omit = [ "**/__init__.py", "*_tab.py", "tools/*.py", "**/plot/*.py" ]
parallel = true
source = [ "src" ]

[tool.marimo.runtime]
pythonpath = [ "notebooks", "notebooks/common" ]

[tool.xdoctest]
options = ""
quiet = true

[tool.jupytext]
# https://jupytext.readthedocs.io/en/latest/config.html
# Pair ipynb notebooks to py:percent text notebooks
formats = "ipynb,py:percent"

[tool.creosote]
deps-file = "pyproject.toml"
paths = [ "src" ]
sections = [ "project.dependencies" ]
venvs = [ ".venv" ]

[tool.rstcheck]
report_level = "ERROR"
ignore_messages = '(Unknown directive type "(todo.*|automodule)".$)'
